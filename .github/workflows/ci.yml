name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: python -m pip_audit -r requirements.txt

  plugins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [ai-quote-parser, ai-answer-judge, ai-price-anomaly, ai-intent-router]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag novatekku-public:ci backend
      - run: docker inspect novatekku-public:ci --format '{{.Config.User}}' | grep -Fx '10001:10001'
      - run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges:true novatekku-public:ci python -c "from app.main import app; assert app"
